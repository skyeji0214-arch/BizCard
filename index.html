<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>명함등록</title>
<meta name="theme-color" content="#f5f8ff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="명함등록">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html,body{margin:0;height:100%;background:#f5f8ff;font-family:sans-serif}
iframe{border:0;width:100%;height:100%;display:block}
#err{padding:24px;color:#555;line-height:1.6}
</style>
</head><body>
<iframe id="f" allow="camera; clipboard-write; clipboard-read" style="display:none"></iframe>
<div id="err" style="display:none">index.html 안의 <b>GAS_URL</b>에 앱스크립트 웹 앱 주소(…/exec)를 넣어주세요.</div>
<script>
// ▼ 앱스크립트 [배포 → 웹 앱 URL]을 여기에 붙여넣으세요 (…/exec 로 끝나는 주소)
const GAS_URL = 'YOUR_GAS_URL';

if (GAS_URL.indexOf('https://script.google.com') === 0) {
  const f = document.getElementById('f'); f.src = GAS_URL; f.style.display = 'block';
} else { document.getElementById('err').style.display = 'block'; }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body></html>
